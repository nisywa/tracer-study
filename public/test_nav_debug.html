<!DOCTYPE html>
<html>
<head>
    <title>Navigation Debug Test</title>
</head>
<body>
    <h1>Navigation Debug Test</h1>
    <div id="results"></div>

    <script>
        // Simulate the data structure from the backend
        const blockStructure = [
            {
                id: 48,
                nama: "Identitas Lulusan",
                urutan: 2,
                questions: []
            },
            {
                id: 49,
                nama: "Kebekerjaan Lulusan", 
                urutan: 3,
                questions: [{
                    id: 26,
                    tipe: "radio",
                    pertanyaan: "Jelaskan status Anda Saat Ini...",
                    templateJawaban: [
                        { id: 30, pilihan_jawaban: "Bekerja", navigation_target: "block_3" },
                        { id: 31, pilihan_jawaban: "Wiraswasta", navigation_target: "block_4" },
                        { id: 32, pilihan_jawaban: "Melanjutkan pendidikan", navigation_target: "block_5" }
                    ]
                }]
            },
            {
                id: 50,
                nama: "Pertanyaan khusus Bekerja/ Wiraswasta",
                urutan: 4,
                questions: []
            },
            {
                id: 51,
                nama: "Pertanyaan khusus wiraswasta",
                urutan: 5, 
                questions: []
            },
            {
                id: 52,
                nama: "Pertanyaan khusus melanjutkan pendidikan",
                urutan: 6,
                questions: []
            }
        ];

        // Convert data just like in the frontend
        const allBlocks = blockStructure.map(block => ({
            ...block,
            questions: block.questions.map(q => ({
                ...q,
                template_jawaban: q.templateJawaban || q.template_jawaban || []
            }))
        }));

        function testNavigation() {
            const results = document.getElementById('results');
            results.innerHTML = '<h2>Navigation Test Results</h2>';
            
            console.log('=== NAVIGATION TEST ===');
            console.log('All blocks:', allBlocks);
            
            const question = allBlocks[1].questions[0]; // Radio question
            console.log('Testing question:', question);
            console.log('Template jawaban:', question.template_jawaban);
            
            question.template_jawaban.forEach((option, index) => {
                console.log(`\n--- Testing Option ${index + 1}: ${option.pilihan_jawaban} ---`);
                console.log('Navigation target:', option.navigation_target);
                
                if (option.navigation_target && option.navigation_target.startsWith('block_')) {
                    const targetBlockOrder = parseInt(option.navigation_target.replace('block_', ''));
                    console.log('Target block order:', targetBlockOrder);
                    
                    const targetBlock = allBlocks.find(block => block.urutan === targetBlockOrder);
                    console.log('Found target block:', targetBlock);
                    
                    if (targetBlock) {
                        const resultText = `✅ Option "${option.pilihan_jawaban}" → ${option.navigation_target} → Block "${targetBlock.nama}" (ID: ${targetBlock.id}, Order: ${targetBlock.urutan})`;
                        console.log(resultText);
                        results.innerHTML += `<p style="color: green">${resultText}</p>`;
                    } else {
                        const errorText = `❌ Option "${option.pilihan_jawaban}" → ${option.navigation_target} → Block NOT FOUND`;
                        console.log(errorText);
                        results.innerHTML += `<p style="color: red">${errorText}</p>`;
                    }
                } else {
                    const infoText = `ℹ️ Option "${option.pilihan_jawaban}" → No block navigation (${option.navigation_target})`;
                    console.log(infoText);
                    results.innerHTML += `<p style="color: blue">${infoText}</p>`;
                }
            });
            
            // Show current mapping
            results.innerHTML += '<h3>Current Block Mapping:</h3>';
            allBlocks.forEach(block => {
                results.innerHTML += `<p>Block ID: ${block.id}, Name: "${block.nama}", Order: ${block.urutan}</p>`;
            });
        }

        // Run test when page loads
        window.onload = testNavigation;
    </script>
</body>
</html>
