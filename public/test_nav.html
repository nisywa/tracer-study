<!DOCTYPE html>
<html>
<head>
    <title>Survey Navigation Test</title>
    <script>
        // Simulate the survey structure from the test_navigation.php output
        const surveyStructure = [
            {
                id: 48,
                nama: "Identitas Lulusan",
                urutan: 2,
                questions: []
            },
            {
                id: 49,
                nama: "Kebekerjaan Lulusan", 
                urutan: 3,
                questions: [{
                    id: 26,
                    tipe: "radio",
                    pertanyaan: "Jelaskan status Anda Saat Ini...",
                    template_jawaban: [
                        { id: 30, pilihan_jawaban: "Bekerja", navigation_target: "block_3" },
                        { id: 31, pilihan_jawaban: "Wiraswasta", navigation_target: "block_4" },
                        { id: 32, pilihan_jawaban: "Melanjutkan pendidikan", navigation_target: "block_5" }
                    ]
                }]
            },
            {
                id: 50,
                nama: "Pertanyaan khusus Bekerja/ Wiraswasta",
                urutan: 4,
                questions: []
            },
            {
                id: 51,
                nama: "Pertanyaan khusus wiraswasta",
                urutan: 5, 
                questions: []
            },
            {
                id: 52,
                nama: "Pertanyaan khusus melanjutkan pendidikan",
                urutan: 6,
                questions: []
            }
        ];

        function testNavigation() {
            console.log('=== TESTING NAVIGATION ===');
            console.log('Survey Structure:', surveyStructure);
            
            // Test question 26 with different selections
            const question = surveyStructure[1].questions[0]; // Question 26
            
            console.log('\n--- Testing Option 1: Bekerja (should go to block_3) ---');
            testOption(question, 30, "block_3"); // Should stay in same block (urutan 3)
            
            console.log('\n--- Testing Option 2: Wiraswasta (should go to block_4) ---');
            testOption(question, 31, "block_4"); // Should go to urutan 4
            
            console.log('\n--- Testing Option 3: Melanjutkan pendidikan (should go to block_5) ---');
            testOption(question, 32, "block_5"); // Should go to urutan 5
        }

        function testOption(question, selectedAnswerId, expectedTarget) {
            console.log(`Testing selection: ${selectedAnswerId}`);
            
            const selectedOption = question.template_jawaban.find(opt => opt.id == selectedAnswerId);
            console.log('Selected option:', selectedOption);
            
            if (selectedOption.navigation_target.startsWith('block_')) {
                const targetBlockOrder = parseInt(selectedOption.navigation_target.replace('block_', ''));
                console.log('Target block order:', targetBlockOrder);
                
                const targetBlock = surveyStructure.find(block => block.urutan === targetBlockOrder);
                
                if (targetBlock) {
                    console.log(`✅ SUCCESS: Found target block "${targetBlock.nama}" (ID: ${targetBlock.id}, Order: ${targetBlock.urutan})`);
                    console.log(`Navigation: ${selectedOption.pilihan_jawaban} → ${selectedOption.navigation_target} → Block "${targetBlock.nama}"`);
                } else {
                    console.log(`❌ ERROR: Target block with order ${targetBlockOrder} not found`);
                    console.log('Available orders:', surveyStructure.map(b => b.urutan));
                }
            }
        }

        window.onload = function() {
            testNavigation();
        };
    </script>
</head>
<body>
    <h1>Survey Navigation Test</h1>
    <p>Open browser console to see test results</p>
</body>
</html>
